services:
  reality-simulation:
    build:
      context: .
      dockerfile: Dockerfile
    image: xaoex/reality-simulation-code:latest
    container_name: reality-simulation-code
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - REALITY_SIMULATION_VERSION=1.0.0
    volumes:
      # Mount for data persistence if needed
      - reality-data:/app/data
    # Uncomment if exposing a port
    # ports:
    #   - "3000:3000"
    networks:
      - xaoex-network
    labels:
      - "com.xaoex.description=Reality Simulation Code - Complete xaoex package"
      - "com.xaoex.version=1.0.0"
      - "com.xaoex.realtime=true"
      - "com.xaoex.alwaysOn=true"

networks:
  xaoex-network:
    driver: bridge
    name: xaoex-network

volumes:
  reality-data:
    name: xaoex-reality-data
