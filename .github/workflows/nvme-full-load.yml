name: NVMe full-load A/B test suite

on:
  workflow_dispatch:
    inputs:
      runner_labels:
        description: JSON array of runner labels, e.g. ["self-hosted","linux","x64","nvme"]
        required: false
        default: '["ubuntu-latest"]'
      max_parallel_ab_jobs:
        description: Maximum number of parallel A/B workflow jobs
        required: false
        default: "4"

permissions:
  contents: read

jobs:
  discover-ab-workflows:
    name: Discover A/B workflows
    runs-on: ubuntu-latest
    outputs:
      ab_matrix: ${{ steps.discover.outputs.ab_matrix }}
      ab_count: ${{ steps.discover.outputs.ab_count }}
    steps:
      - uses: actions/checkout@v4

      - name: Install workflow parsing dependency
        run: python3 -m pip install pyyaml

      - name: Discover workflow files
        id: discover
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import fnmatch
          import json
          import os
          import yaml

          patterns = [
              'ab-*.yml',
              'AB-*.yml',
              '*-ab-*.yml',
              '*-AB-*.yml',
              '*abtest*.yml',
              '*AB*test*.yml',
          ]
          workflows = sorted(
              file_name
              for file_name in os.listdir('.github/workflows')
              if any(fnmatch.fnmatch(file_name, pattern) for pattern in patterns)
          )
          if not workflows:
              raise SystemExit('No A/B workflow files found in .github/workflows.')

          matrix_entries = []
          for workflow_name in workflows:
              workflow_path = os.path.join('.github', 'workflows', workflow_name)
              with open(workflow_path, 'r', encoding='utf-8') as handle:
                  workflow = yaml.load(handle, Loader=yaml.BaseLoader)

              for required_key in ('name', 'on', 'jobs'):
                  if required_key not in workflow:
                      raise SystemExit(f"Missing required key '{required_key}' in {workflow_name}")

              commands = []
              for job in workflow.get('jobs', {}).values():
                  for step in job.get('steps', []):
                      if 'run' not in step:
                          continue
                      unsupported_keys = [key for key in ('env', 'working-directory', 'shell') if key in step]
                      if unsupported_keys:
                          raise SystemExit(
                              f"{workflow_name} contains unsupported run-step keys for full-load replay: {', '.join(unsupported_keys)}"
                          )
                      commands.append(step['run'].rstrip())

              if not commands:
                  raise SystemExit(f'No run commands found in {workflow_name}')

              needs_autotools = any(
                  command.strip().startswith('./configure')
                  or command.strip().startswith('make')
                  or 'distcheck' in command
                  for command in commands
              )
              matrix_entries.append(
                  {
                      'workflow': workflow_name,
                      'commands_json': json.dumps(commands),
                      'needs_autotools': needs_autotools,
                  }
              )

          print(f"ab_count={len(workflows)}")
          print(f"ab_matrix={json.dumps(matrix_entries)}")
          PY < /tmp/ab-workflows.txt

  npm-suite:
    name: npm test + build
    needs: discover-ab-workflows
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  autotools-suite:
    name: configure + make + check + distcheck
    needs: discover-ab-workflows
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap autotools
        shell: bash
        run: |
          if [ -x ./autogen.sh ]; then
            ./autogen.sh
          elif [ ! -x ./configure ] && { [ -f configure.ac ] || [ -f configure.in ] || [ -f Makefile.am ]; }; then
            autoreconf -fi
          fi

      - name: Configure
        run: ./configure

      - name: Build
        run: make

      - name: Check
        run: make check

      - name: Distcheck
        run: make distcheck

  cmake-suite:
    name: CMake configure + build + test
    needs: discover-ab-workflows
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}/build"

      - name: Build
        run: cmake --build "${{ github.workspace }}/build"

      - name: Test
        run: ctest --test-dir "${{ github.workspace }}/build" --output-on-failure

  ab-workflow-load:
    name: A/B workflow full load
    needs:
      - discover-ab-workflows
      - npm-suite
      - autotools-suite
      - cmake-suite
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel_ab_jobs) }}
      matrix:
        include: ${{ fromJSON(needs.discover-ab-workflows.outputs.ab_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Show workflow under load
        run: echo "Running full-load validation for ${{ matrix.workflow }}"

      - name: Bootstrap autotools if needed
        if: ${{ matrix.needs_autotools }}
        shell: bash
        run: |
          if [ -x ./autogen.sh ]; then
            ./autogen.sh
          elif [ ! -x ./configure ] && { [ -f configure.ac ] || [ -f configure.in ] || [ -f Makefile.am ]; }; then
            autoreconf -fi
          fi

      - name: Execute workflow load commands
        shell: bash
        env:
          WORKFLOW_NAME: ${{ matrix.workflow }}
          COMMANDS_JSON: ${{ matrix.commands_json }}
        run: |
          python - <<'PY' > /tmp/ab-workflow-load.sh
          import json
          import os
          workflow_name = os.environ["WORKFLOW_NAME"]
          commands = json.loads(os.environ["COMMANDS_JSON"])

          print("set -euo pipefail")
          for index, command in enumerate(commands, start=1):
              print(f"echo \"Executing run step {index} from {workflow_name}\"")
              print(command)
          PY

          bash /tmp/ab-workflow-load.sh
