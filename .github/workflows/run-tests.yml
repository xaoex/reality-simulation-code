name: Run Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run tests
        run: npm test

  ab-test-configurations:
    name: Verify A/B test configurations
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate A/B test workflow files
        run: |
          mapfile -t ab_workflows < <(find .github/workflows -maxdepth 1 -type f -name '*.yml' | grep -Ei '/[^/]*ab[^/]*\.yml$' || true)
          if [ "${#ab_workflows[@]}" -eq 0 ]; then
            echo "No A/B test workflow files found in .github/workflows."
            exit 1
          fi

          echo "Found ${#ab_workflows[@]} A/B test workflow file(s)."
          for workflow in "${ab_workflows[@]}"; do
            echo "Validating ${workflow}"
            grep -Eq '^[[:space:]]*name:' "${workflow}"
            grep -Eq '^[[:space:]]*on:' "${workflow}"
            grep -Eq '^[[:space:]]*jobs:' "${workflow}"
          done

      - name: Validate package scripts
        run: |
          echo "Available npm scripts:"
          node -e "const p=require('./package.json'); Object.keys(p.scripts).forEach(s => console.log(' -', s, ':', p.scripts[s]))"
