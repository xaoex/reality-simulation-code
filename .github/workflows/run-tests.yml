name: Run Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run tests
        run: npm test

  ab-test-configurations:
    name: Verify A/B test configurations
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Check A/B test workflow files exist
        run: |
          echo "Listing A/B test workflow configurations:"
          ls .github/workflows/ab-*.yml .github/workflows/AB-*.yml
          echo "Total workflow files:"
          ls .github/workflows/*.yml | wc -l

      - name: Validate package scripts
        run: |
          echo "Available npm scripts:"
          node -e "const p=require('./package.json'); Object.keys(p.scripts).forEach(s => console.log(' -', s, ':', p.scripts[s]))"
