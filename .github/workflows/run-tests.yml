name: Run Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run tests
        run: npm test

  ab-test-configurations:
    name: Verify A/B test configurations
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate A/B test workflow files
        shell: bash
        run: |
          mapfile -t ab_workflows < <(
            find .github/workflows -maxdepth 1 -type f \
              \( -name 'ab-*.yml' -o -name 'AB-*.yml' -o -name '*-ab-*.yml' -o -name '*-AB-*.yml' -o -name '*abtest*.yml' -o -name '*AB*test*.yml' \)
          )
          if [ "${#ab_workflows[@]}" -eq 0 ]; then
            echo "No A/B test workflow files found in .github/workflows."
            exit 1
          fi

          echo "Found ${#ab_workflows[@]} A/B test workflow file(s)."
          for workflow in "${ab_workflows[@]}"; do
            echo "Validating ${workflow}"
            grep -Eq '^name:[[:space:]]*' "${workflow}" || { echo "Missing required key 'name' in ${workflow}"; exit 1; }
            grep -Eq '^on:[[:space:]]*' "${workflow}" || { echo "Missing required key 'on' in ${workflow}"; exit 1; }
            grep -Eq '^jobs:[[:space:]]*' "${workflow}" || { echo "Missing required key 'jobs' in ${workflow}"; exit 1; }
          done
